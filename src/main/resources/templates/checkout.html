<!DOCTYPE html>
<html>

<head>
    <title>Checkout</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div style="display:flex; justify-content:space-between; align-items:center; padding:20px;">

    <a href="/">
    <button>🏠 Home</button>
    </a>

    <a href="/cart">
    <button>
    🛒 Cart (<span id="cartCount">0</span>)
    </button>
    </a>

</div>

<h1>Checkout</h1>

<form style="width:400px; text-align:left; margin:auto;">

    <h2>Shipping Information</h2>

    <label>First Name</label><br>
    <input type="text" required style="width:100%; padding:10px;"><br><br>

    <label>Last Name</label><br>
    <input type="text" required style="width:100%; padding:10px;"><br><br>

    <label>Email</label><br>
    <input type="email" required style="width:100%; padding:10px;"><br><br>

    <label>Phone Number</label><br>
    <input type="text" required style="width:100%; padding:10px;"><br><br>

    <label>Address</label><br>
    <input type="text" required style="width:100%; padding:10px;"><br><br>

    <label>City</label><br>
    <input type="text" required style="width:100%; padding:10px;"><br><br>

    <label>State</label><br>
    <input type="text" required style="width:100%; padding:10px;"><br><br>

    <label>ZIP Code</label><br>
    <input type="text" required style="width:100%; padding:10px;"><br><br>


    <h2>Payment Information</h2>

    <label>Name on Card</label><br>
    <input type="text" required style="width:100%; padding:10px;"><br><br>

    <label>Card Number</label><br>
    <input
        id="cardNumber"
        type="text"
        placeholder="1234 5678 9012 3456"
        style="width:100%; padding:10px;"><br><br>

    <label>Expiration</label><br>
    <input
        type="text"
        placeholder="MM/YY"
        style="width:100%; padding:10px;"><br><br>

    <label>CVV</label><br>
    <input
        type="password"
        maxlength="4"
        style="width:100%; padding:10px;"><br><br>

    <button type="button" onclick="placeOrder()">
    Complete Order
    </button>

</form>

<script>

    function updateCartCount(){
    
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    
    document.getElementById("cartCount").innerText = cart.length;
    
    }
    
    function placeOrder(){
    
    let cardNumber = document.getElementById("cardNumber").value;
    
    cardNumber = cardNumber.replace(/\s/g, "");
    
    // Fake declined cards
    if(
    cardNumber === "4000000000000002" ||
    cardNumber === "1111111111111111"
    ){
    
    alert("❌ Payment Declined!\n\nYour bank declined this transaction.");
    
    return;
    
    }
    
    // Invalid card length
    if(cardNumber.length !== 16){
    
    alert("⚠️ Please enter a valid 16-digit card number.");
    
    return;
    
    }
    
    // Fake processing
    alert("⏳ Processing Payment...");
    
    setTimeout(function(){
    
    alert("Payment Approved!\n\nThank you for shopping at Perfume Palace!");
    
    localStorage.removeItem("cart");
    
    window.location.href="/order-confirmation";
    
    },1500);
    
    }
    
    updateCartCount();

</script>

</body>
</html>
